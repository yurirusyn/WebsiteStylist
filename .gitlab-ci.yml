stages:
  - build
  - test

create_file_job:
  stage: build
  image: alpine
  script:
    - echo "Building..."
    - mkdir build
    - touch build/somefile.txt
  artifacts:
    paths:
      - build/

test_file:
  stage: test
  image: alpine
  script:
    - test -f build/somefile.txt
  dependencies:
    - create_file_job